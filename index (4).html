<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX 업무 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --border:#2a2f3a;
    --text:#e8eaed;
    --text-dim:#9aa1ac;
    --accent:#5b8cff;
    --accent-dim:#2a3a63;
    --good:#3ecf8e;
    --warn:#f2b94b;
    --danger:#f2555a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:28px;
  }
  header.top h1{
    font-size:22px;
    margin:0 0 4px;
    font-weight:700;
  }
  header.top .date{
    color:var(--text-dim);
    font-size:14px;
  }
  section{
    margin-bottom:32px;
  }
  section h2{
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    margin:0 0 12px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  /* stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:12px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
  }
  .stat .label{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    outline:none;
  }
  .stat .value{
    font-size:20px;
    font-weight:700;
    outline:none;
  }
  .stat .label[contenteditable], .stat .value[contenteditable]{
    cursor:text;
    border-radius:6px;
  }
  .stat .label[contenteditable]:focus, .stat .value[contenteditable]:focus{
    box-shadow:0 0 0 2px var(--accent-dim);
  }
  .stat-hint{
    font-size:11px;
    color:var(--text-dim);
    margin-top:10px;
  }

  /* todo */
  .todo-input{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .todo-input input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .todo-input input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .todo-input button, .note-input button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .todo-list, .note-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .todo-list li{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .todo-list li input[type=checkbox]{
    width:18px;
    height:18px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  .todo-list li span{
    flex:1;
    font-size:14px;
    word-break:break-word;
  }
  .todo-list li.done span{
    color:var(--text-dim);
    text-decoration:line-through;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
    flex-shrink:0;
  }
  .del-btn:hover{
    color:var(--danger);
    background:rgba(242,85,90,.1);
  }
  .empty{
    color:var(--text-dim);
    font-size:13px;
    padding:14px 4px;
  }

  /* notes */
  .note-input{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    align-items:flex-start;
  }
  .note-input textarea{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
    min-height:44px;
  }
  .note-input textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .note-list li{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .note-list li .body{
    flex:1;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .note-list li .time{
    font-size:11px;
    color:var(--text-dim);
    display:block;
    margin-top:4px;
  }

  /* filter */
  .filters{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .filters button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .filters button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* cards */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:12px;
  }
  .card{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    color:var(--text);
    font-family:inherit;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }
  .card .name{
    font-size:15px;
    font-weight:700;
  }
  .card .desc{
    font-size:13px;
    color:var(--text-dim);
  }
  .card .tag{
    align-self:flex-start;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px 8px;
    margin-top:4px;
  }
  .card.hidden{
    display:none;
  }

  /* toast */
  #toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:100;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>AX 업무 대시보드</h1>
      <div class="date" id="todayDate"></div>
    </div>
  </header>

  <!-- 중요 지표: 값을 클릭해서 직접 수정하면 자동 저장됩니다 -->
  <section id="statsSection">
    <h2>주요 지표</h2>
    <div class="stats" id="statsGrid"></div>
    <div class="stat-hint">라벨/값을 클릭하면 바로 수정할 수 있고, 자동으로 저장됩니다.</div>
  </section>

  <!-- 오늘 할일: 입력 후 Enter 또는 추가 버튼. 체크/삭제 가능, localStorage에 저장 -->
  <section id="todoSection">
    <h2>오늘 할일 / 일정</h2>
    <div class="todo-input">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
      <button id="todoAddBtn">추가</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </section>

  <!-- 메모/아이디어: 입력 후 Enter(Shift+Enter는 줄바꿈) 또는 추가 버튼 -->
  <section id="noteSection">
    <h2>메모 / 아이디어</h2>
    <div class="note-input">
      <textarea id="noteInput" placeholder="생각난 것을 짧게 적어두세요 (Enter로 저장, Shift+Enter는 줄바꿈)" rows="2"></textarea>
      <button id="noteAddBtn">저장</button>
    </div>
    <ul class="note-list" id="noteList"></ul>
  </section>

  <!--
    프로그램 카드 추가/수정 방법:
    .grid 안의 <button class="card"> 블록을 복사해서
    - data-c: 분류 (core / live / side 중 하나, 쉼표로 여러 개 가능)
    - data-open: 배포된 프로젝트면 열릴 URL
    - data-copy: 로컬 프로젝트면 클립보드로 복사할 실행 명령어
    - data-alt: (선택) Shift+클릭 시 대신 복사할 명령어 (예: 백엔드 실행 명령어)
    data-open과 data-copy 중 하나만 넣으면 됩니다.
  -->
  <section id="programSection">
    <h2>자주 쓰는 프로그램</h2>
    <div class="filters" id="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="core">코어</button>
      <button data-filter="live">가동중</button>
      <button data-filter="side">사이드</button>
    </div>
    <div class="grid" id="cardGrid">

      <button class="card" data-c="core,live" data-copy="uvicorn main:app --reload" data-alt="uvicorn main:app --host 0.0.0.0 --port 8000">
        <span class="name">메이원 체크인 백엔드</span>
        <span class="desc">아이패드 체크인 → SMS 발송 백엔드 (로컬 실행, Shift+클릭 시 배포용 명령어 복사)</span>
        <span class="tag">로컬 · core</span>
      </button>

      <button class="card" data-c="side" data-open="https://example.com">
        <span class="name">예시: 배포된 프로젝트</span>
        <span class="desc">카드 전체를 클릭하면 새 탭에서 열립니다 (data-open)</span>
        <span class="tag">배포됨 · side</span>
      </button>

      <button class="card" data-c="core" data-copy="npm run dev">
        <span class="name">예시: 로컬 프로젝트</span>
        <span class="desc">카드를 클릭하면 실행 명령어가 클립보드에 복사됩니다 (data-copy)</span>
        <span class="tag">로컬 · core</span>
      </button>

    </div>
  </section>

  <footer>모든 데이터는 이 브라우저의 localStorage에만 저장됩니다. 다른 기기/브라우저와는 동기화되지 않습니다.</footer>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- date ----------
  var dateEl = document.getElementById('todayDate');
  var today = new Date();
  var weekdays = ['일','월','화','수','목','금','토'];
  dateEl.textContent = today.getFullYear() + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일 (' + weekdays[today.getDay()] + ')';

  // ---------- toast ----------
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('show');
    }, 1800);
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  // ---------- storage helper ----------
  function loadJSON(key, fallback){
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function saveJSON(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // ---------- stats ----------
  var STATS_KEY = 'ax_dashboard_stats_v1';
  var defaultStats = [
    { label: '오늘 예약', value: '-' },
    { label: 'SMS 발송량', value: '-' },
    { label: '진행중 프로젝트', value: '-' },
    { label: '이번주 마감', value: '-' }
  ];
  var stats = loadJSON(STATS_KEY, defaultStats);
  var statsGrid = document.getElementById('statsGrid');

  function renderStats(){
    statsGrid.innerHTML = '';
    stats.forEach(function(stat, idx){
      var el = document.createElement('div');
      el.className = 'stat';
      var labelEl = document.createElement('div');
      labelEl.className = 'label';
      labelEl.contentEditable = 'true';
      labelEl.textContent = stat.label;
      labelEl.addEventListener('blur', function(){
        stats[idx].label = labelEl.textContent.trim() || stat.label;
        saveJSON(STATS_KEY, stats);
      });
      var valueEl = document.createElement('div');
      valueEl.className = 'value';
      valueEl.contentEditable = 'true';
      valueEl.textContent = stat.value;
      valueEl.addEventListener('blur', function(){
        stats[idx].value = valueEl.textContent.trim() || stat.value;
        saveJSON(STATS_KEY, stats);
      });
      el.appendChild(labelEl);
      el.appendChild(valueEl);
      statsGrid.appendChild(el);
    });
  }
  renderStats();

  // ---------- todo ----------
  var TODO_KEY = 'ax_dashboard_todos_v1';
  var todos = loadJSON(TODO_KEY, []);
  var todoList = document.getElementById('todoList');
  var todoInput = document.getElementById('todoInput');
  var todoAddBtn = document.getElementById('todoAddBtn');

  function renderTodos(){
    todoList.innerHTML = '';
    if (!todos.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '할 일이 없습니다. 위에 입력해보세요.';
      todoList.appendChild(empty);
      return;
    }
    todos.forEach(function(todo, idx){
      var li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!todo.done;
      cb.addEventListener('change', function(){
        todos[idx].done = cb.checked;
        saveJSON(TODO_KEY, todos);
        renderTodos();
      });

      var span = document.createElement('span');
      span.textContent = todo.text;

      var del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.setAttribute('aria-label', '삭제');
      del.addEventListener('click', function(){
        todos.splice(idx, 1);
        saveJSON(TODO_KEY, todos);
        renderTodos();
      });

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(del);
      todoList.appendChild(li);
    });
  }

  function addTodo(){
    var text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false });
    saveJSON(TODO_KEY, todos);
    todoInput.value = '';
    renderTodos();
  }

  todoAddBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') addTodo();
  });

  renderTodos();

  // ---------- notes ----------
  var NOTE_KEY = 'ax_dashboard_notes_v1';
  var notes = loadJSON(NOTE_KEY, []);
  var noteList = document.getElementById('noteList');
  var noteInput = document.getElementById('noteInput');
  var noteAddBtn = document.getElementById('noteAddBtn');

  function formatTime(ts){
    var d = new Date(ts);
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderNotes(){
    noteList.innerHTML = '';
    if (!notes.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '메모가 없습니다.';
      noteList.appendChild(empty);
      return;
    }
    notes.slice().reverse().forEach(function(note){
      var realIdx = notes.indexOf(note);
      var li = document.createElement('li');

      var body = document.createElement('div');
      body.className = 'body';
      body.textContent = note.text;
      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(note.ts);
      body.appendChild(time);

      var del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.setAttribute('aria-label', '삭제');
      del.addEventListener('click', function(){
        notes.splice(realIdx, 1);
        saveJSON(NOTE_KEY, notes);
        renderNotes();
      });

      li.appendChild(body);
      li.appendChild(del);
      noteList.appendChild(li);
    });
  }

  function addNote(){
    var text = noteInput.value.trim();
    if (!text) return;
    notes.push({ text: text, ts: Date.now() });
    saveJSON(NOTE_KEY, notes);
    noteInput.value = '';
    renderNotes();
  }

  noteAddBtn.addEventListener('click', addNote);
  noteInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      addNote();
    }
  });

  renderNotes();

  // ---------- program cards ----------
  var cardGrid = document.getElementById('cardGrid');
  var filterBar = document.getElementById('filters');

  cardGrid.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if (!card) return;

    var openUrl = card.getAttribute('data-open');
    var copyText_ = card.getAttribute('data-copy');
    var altText = card.getAttribute('data-alt');

    if (e.shiftKey && altText) {
      copyText(altText).then(function(){
        showToast('복사됨: ' + altText);
      });
      return;
    }

    if (openUrl) {
      window.open(openUrl, '_blank', 'noopener');
      return;
    }

    if (copyText_) {
      copyText(copyText_).then(function(){
        showToast('복사됨: ' + copyText_);
      });
    }
  });

  filterBar.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    var filter = btn.getAttribute('data-filter');

    filterBar.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });

    cardGrid.querySelectorAll('.card').forEach(function(card){
      var cats = (card.getAttribute('data-c') || '').split(',').map(function(s){ return s.trim(); });
      var show = filter === 'all' || cats.indexOf(filter) !== -1;
      card.classList.toggle('hidden', !show);
    });
  });

})();
</script>
</body>
</html>
